spring:
  application:
    name: university-management-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/university}
    username: ${DB_USERNAME:university}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  modulith:
    runtime:
      verification-enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

